suite: Egress gateway
templates:
- atenet-egress.yaml
tests:
- it: scopes upstream connections to the execution by default
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: "upstreamConnections: perExecution\n"
- it: renders the shared pool when selected
  set:
    atenetEgress.agentgateway.upstreamConnections: shared
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: "upstreamConnections: shared\n"
- it: rejects an unknown pooling mode
  set:
    atenetEgress.agentgateway.upstreamConnections: perActor
  asserts:
  - failedTemplate:
      errorMessage: atenetEgress.agentgateway.upstreamConnections must be perExecution or shared
