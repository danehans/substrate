bootstrap_extensions:
- name: envoy.bootstrap.internal_listener
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener
static_resources:
  listeners:
  - name: outer
    address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: outer
          delayed_close_timeout: 0s
          upgrade_configs: [{upgrade_type: CONNECT}]
          route_config:
            name: connect
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: {connect_matcher: {}}
                route:
                  cluster: inner
                  timeout: 0s
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
          http_filters:
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: dev.ate.revocation.mode
                factory_key: envoy.hashable_string
                shared_with_upstream: ONCE
                format_string:
                  text_format_source: {inline_string: required}
              - object_key: dev.ate.revocation.identity
                factory_key: envoy.hashable_string
                shared_with_upstream: ONCE
                format_string:
                  text_format_source: {inline_string: 'IDENTITY_PLACEHOLDER'}
              - object_key: dev.ate.revocation.token
                factory_key: envoy.hashable_string
                shared_with_upstream: ONCE
                format_string:
                  text_format_source: {inline_string: TOKEN_PLACEHOLDER}
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  - name: inner
    internal_listener: {}
    filter_chains:
    - INNER_TLS_PLACEHOLDER
      filters:
      - name: envoy.filters.network.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.dynamic_modules.v3.DynamicModuleNetworkFilter
          dynamic_module_config: {name: envoy_substrate_egress_policy}
          filter_name: envoy_substrate_revocation
INNER_FILTER_PLACEHOLDER
  clusters:
  - name: inner
    connect_timeout: 1s
    type: STATIC
    transport_socket:
      name: envoy.transport_sockets.internal_upstream
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
        transport_socket:
          name: envoy.transport_sockets.raw_buffer
          typed_config: {"@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer}
    load_assignment:
      cluster_name: inner
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {envoy_internal_address: {server_listener_name: inner}}}
  - name: echo
    connect_timeout: 1s
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: echo
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: host.docker.internal, port_value: ORIGIN_PORT_PLACEHOLDER}}}

  - name: revocation_control
    connect_timeout: 1s
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: revocation_control
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: host.docker.internal, port_value: CONTROL_PORT_PLACEHOLDER}}}
